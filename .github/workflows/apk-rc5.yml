name: apk-rc5

# 实验分支：把内置引擎换成 DSH 0.2.2-rc.5（上游 1.3.0 固定的是 rc.1）。
# runtime 在这里自建，而不是从官方 APK 里取；tawcroot 库与引擎版本无关，仍取官方包。
# 注意：rc.5 上有 41 个补丁打不上，已从补丁集剔除，所以这个包是"113/154 补丁"的实验版。

on:
  workflow_dispatch:

concurrency:
  group: apk-rc5-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai
  DSH_MAVEN_MIRRORS: 0
  OFFICIAL_TAG: v1.3.0
  OFFICIAL_APK: dsh-go-1.3.0-arm64.apk

jobs:
  apk:
    name: Android arm64 (DSH rc.5)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build the arm64 runtime (DSH 0.2.2-rc.5)
        env:
          DSH_VERSION: 0.2.2-rc.5
          RUNTIME_REVISION: r16
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gpgv
          runtime/build-runtime.sh arm64-v8a
          python3 - <<'PY'
          import json
          m = json.load(open("runtime/out/arm64-v8a/assets/runtime/manifest.json"))
          print("manifest:", m["runtimeVersion"], m["dshVersion"], m["nodeVersion"], m["abi"])
          assert m["dshVersion"] == "0.2.2-rc.5", m["dshVersion"]
          PY

      - name: Extract libtawcroot.so from the official APK
        run: |
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/official.apk" \
            "https://github.com/ccch1mneyyy/dsh-go/releases/download/$OFFICIAL_TAG/$OFFICIAL_APK"
          python3 - <<'PY'
          import os, pathlib, shutil, zipfile
          apk = os.path.join(os.environ["RUNNER_TEMP"], "official.apk")
          out = pathlib.Path("runtime/out-tawcroot/jniLibs/arm64-v8a")
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(apk) as z:
              name = "lib/arm64-v8a/libtawcroot.so"
              with z.open(name) as src, open(out / "libtawcroot.so", "wb") as dst:
                  shutil.copyfileobj(src, dst)
          print("tawcroot bytes:", (out / "libtawcroot.so").stat().st_size)
          PY

      - name: Verify the runtime bundle
        run: python3 -I tooling/check_runtime_bundle.py arm64

      - name: Pub get and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Analyze the touched sources
        working-directory: app
        run: dart analyze lib/ui/web/ lib/ui/settings/interface_page.dart

      - name: Build arm64 debug APK
        working-directory: app
        run: flutter build apk --debug --flavor arm64 --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-rc5-debug-arm64
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-rc5-arm64-v8a
          path: |
            runtime/out/arm64-v8a
            runtime/out/arm64-v8a/build-report.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
